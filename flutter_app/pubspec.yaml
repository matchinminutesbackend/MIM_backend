name: match_in_minutes
description: MatchInMinutes - Find Your Perfect Match
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  flutter_webrtc: ^0.12.5
  wakelock_plus: ^1.2.8
  razorpay_flutter: ^1.3.7
  url_launcher: ^6.3.0
  image_cropper: 12.0.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^17.2.2
  flutter_app_badger: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
